<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | 瑋瑋老師的撒野記事錄</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:#f7f5ef;--card:#fff;--text:#2f3a33;--muted:#66756b;--line:#dfe6df;
      --accent:#5d7a67;--accent-soft:#e8efe8;--danger:#a65353;--danger-soft:#f8eaea;
      --success:#3f6d4b;--success-soft:#e8f2ea;--max:1100px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
    a{color:inherit;text-decoration:none}
    button,input,select{font:inherit}
    .wrap{width:min(94%,var(--max));margin:0 auto}
    .nav{position:sticky;top:0;z-index:10;background:rgba(247,245,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
    .nav-inner{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0}
    .brand{font-weight:700}
    .nav-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .small{font-size:.9rem;color:var(--muted)}
    .hero{padding:48px 0 22px}
    .hero-box{background:linear-gradient(135deg,#eef4ee,#fbfaf6);border:1px solid var(--line);border-radius:28px;padding:30px 28px}
    h1,h2,h3{line-height:1.25;margin:0 0 12px}
    h1{font-size:clamp(2rem,5vw,2.8rem)}
    p{margin:0 0 12px}
    .section{padding:8px 0 26px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 10px 28px rgba(0,0,0,.04)}
    .login-card{max-width:520px;margin:20px auto 0}
    .field{display:grid;gap:6px;margin-bottom:14px}
    label{font-weight:600}
    input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text)}
    input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    .btn{border:1px solid var(--accent);border-radius:999px;padding:10px 17px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
    .btn.secondary{background:transparent;color:var(--accent)}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .toolbar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
    .summary-item{background:#fbfbf8;border:1px solid var(--line);border-radius:14px;padding:14px}
    .summary-label{font-size:.86rem;color:var(--muted)}
    .summary-value{font-size:1.35rem;font-weight:700}
    .registration-list{display:grid;gap:16px;margin-top:18px}
    .registration-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
    .registration-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:16px 18px;background:#fbfbf8;border-bottom:1px solid var(--line)}
    .registration-body{padding:16px 18px}
    .contact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;margin-bottom:16px}
    .meta-label{font-size:.82rem;color:var(--muted)}
    .meta-value{word-break:break-word}
    .status{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.84rem}
    .participants-table{width:100%;border-collapse:collapse;margin-top:8px}
    .participants-table th,.participants-table td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
    .participants-table th{color:var(--muted);font-size:.86rem}
    .message{display:none;margin-top:14px;padding:12px 14px;border-radius:14px}
    .message.error{display:block;background:var(--danger-soft);color:var(--danger)}
    .message.success{display:block;background:var(--success-soft);color:var(--success)}
    .empty{padding:28px;text-align:center;color:var(--muted)}
    [hidden]{display:none!important}
    footer{padding:18px 0 46px;color:var(--muted);font-size:.9rem}
    @media(max-width:760px){
      .nav-inner,.registration-head{flex-direction:column;align-items:flex-start}
      .toolbar{grid-template-columns:1fr}
      .summary{grid-template-columns:1fr}
      .contact-grid{grid-template-columns:1fr}
      .hero-box,.card{padding:19px}
      .participants-table{font-size:.92rem}
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="wrap nav-inner">
      <div class="brand">瑋瑋老師的撒野記事錄｜管理後台</div>
      <div class="nav-actions">
        <span id="loginUser" class="small"></span>
        <button id="logoutBtn" class="btn secondary" type="button" hidden>登出</button>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="wrap">
      <div class="hero-box">
        <h1>報名管理 / Admin</h1>
        <p>選擇活動後，可一次查看該活動的所有報名單與每位參加者資料。</p>
      </div>
    </div>
  </header>

  <main>
    <section id="loginSection" class="section">
      <div class="wrap">
        <article class="card login-card">
          <h2>管理員登入</h2>
          <p class="small">此頁面只供管理員使用。</p>
          <form id="loginForm">
            <div class="field">
              <label for="email">E-mail</label>
              <input id="email" type="email" autocomplete="username" required />
            </div>
            <div class="field">
              <label for="password">密碼</label>
              <input id="password" type="password" autocomplete="current-password" required />
            </div>
            <button id="loginBtn" class="btn" type="submit">登入</button>
          </form>
          <div id="loginMessage" class="message"></div>
        </article>
      </div>
    </section>

    <section id="adminSection" class="section" hidden>
      <div class="wrap">
        <article class="card">
          <div class="toolbar">
            <div class="field" style="margin:0">
              <label for="eventSelect">選擇活動</label>
              <select id="eventSelect">
                <option value="">請選擇活動</option>
              </select>
            </div>
            <button id="exportBtn" class="btn secondary" type="button" disabled>匯出 CSV</button>
          </div>

          <div id="summary" class="summary" hidden>
            <div class="summary-item">
              <div class="summary-label">報名單數</div>
              <div id="registrationCount" class="summary-value">0</div>
            </div>
            <div class="summary-item">
              <div class="summary-label">總參加人數</div>
              <div id="participantCount" class="summary-value">0</div>
            </div>
            <div class="summary-item">
              <div class="summary-label">活動總名額</div>
              <div id="capacityCount" class="summary-value">0</div>
            </div>
          </div>

          <div id="adminMessage" class="message"></div>
          <div id="registrationList" class="registration-list">
            <div class="empty">請先選擇一個活動。</div>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">© 2026 瑋瑋老師的撒野記事錄 · Admin Page</div>
  </footer>

<script>
const SUPABASE_URL="https://aexhjnpskprtvpqbxriy.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFleGhqbnBza3BydHZwcWJ4cml5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMzExMjEsImV4cCI6MjEwMTkwNzEyMX0.sMiJ1m8BptiVgCjK43-3cXNLzDto49T8vsNt3ulDNmU";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const loginSection=document.getElementById("loginSection");
const adminSection=document.getElementById("adminSection");
const loginForm=document.getElementById("loginForm");
const loginBtn=document.getElementById("loginBtn");
const loginMessage=document.getElementById("loginMessage");
const loginUser=document.getElementById("loginUser");
const logoutBtn=document.getElementById("logoutBtn");
const eventSelect=document.getElementById("eventSelect");
const registrationList=document.getElementById("registrationList");
const adminMessage=document.getElementById("adminMessage");
const summary=document.getElementById("summary");
const exportBtn=document.getElementById("exportBtn");

let currentEvent=null;
let currentRegistrations=[];

function setMessage(el,message,type){
  el.textContent=message;
  el.className=`message ${type}`;
}
function clearMessage(el){el.textContent="";el.className="message"}
function formatDate(s){
  if(!s)return"—";
  const d=new Date(s+"T00:00:00");
  return new Intl.DateTimeFormat("zh-TW",{year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
}
function formatDateTime(s){
  if(!s)return"—";
  return new Intl.DateTimeFormat("zh-TW",{
    year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"
  }).format(new Date(s));
}
function escapeHtml(value){
  return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

async function applySession(session){
  if(session?.user){
    loginSection.hidden=true;
    adminSection.hidden=false;
    logoutBtn.hidden=false;
    loginUser.textContent=session.user.email||"已登入";
    await loadEvents();
  }else{
    loginSection.hidden=false;
    adminSection.hidden=true;
    logoutBtn.hidden=true;
    loginUser.textContent="";
  }
}

loginForm.addEventListener("submit",async(e)=>{
  e.preventDefault();
  clearMessage(loginMessage);
  loginBtn.disabled=true;
  loginBtn.textContent="登入中…";

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  const {data,error}=await client.auth.signInWithPassword({email,password});

  loginBtn.disabled=false;
  loginBtn.textContent="登入";

  if(error){
    console.error(error);
    setMessage(loginMessage,"登入失敗，請確認 E-mail 與密碼。","error");
    return;
  }
  await applySession(data.session);
});

logoutBtn.addEventListener("click",async()=>{
  await client.auth.signOut();
  eventSelect.innerHTML='<option value="">請選擇活動</option>';
  registrationList.innerHTML='<div class="empty">請先登入。</div>';
  summary.hidden=true;
  currentRegistrations=[];
  currentEvent=null;
  await applySession(null);
});

async function loadEvents(){
  clearMessage(adminMessage);
  const {data,error}=await client
    .from("events")
    .select("id,title,event_date,capacity,status")
    .order("event_date",{ascending:false})
    .order("id",{ascending:false});

  if(error){
    console.error(error);
    setMessage(adminMessage,"無法讀取活動。請確認管理員 RLS SQL 已執行。","error");
    return;
  }

  eventSelect.innerHTML='<option value="">請選擇活動</option>';
  for(const event of data){
    const option=document.createElement("option");
    option.value=event.id;
    option.textContent=`#${event.id}｜${formatDate(event.event_date)}｜${event.title}`;
    option.dataset.capacity=event.capacity;
    option.dataset.title=event.title;
    eventSelect.appendChild(option);
  }
}

eventSelect.addEventListener("change",async()=>{
  const eventId=Number(eventSelect.value);
  if(!eventId){
    currentEvent=null;
    currentRegistrations=[];
    summary.hidden=true;
    exportBtn.disabled=true;
    registrationList.innerHTML='<div class="empty">請先選擇一個活動。</div>';
    return;
  }

  const selected=eventSelect.options[eventSelect.selectedIndex];
  currentEvent={
    id:eventId,
    title:selected.dataset.title,
    capacity:Number(selected.dataset.capacity||0)
  };
  await loadRegistrations(eventId);
});

async function loadRegistrations(eventId){
  clearMessage(adminMessage);
  registrationList.innerHTML='<div class="empty">正在讀取報名資料…</div>';

  const {data,error}=await client
    .from("registrations")
    .select(`
      id,
      event_id,
      name,
      phone,
      email,
      line_id,
      quantity,
      status,
      created_at,
      participants (
        id,
        name,
        birthday
      )
    `)
    .eq("event_id",eventId)
    .order("created_at",{ascending:true});

  if(error){
    console.error(error);
    setMessage(adminMessage,"無法讀取報名資料。請確認管理員登入與 RLS 權限。","error");
    registrationList.innerHTML="";
    summary.hidden=true;
    exportBtn.disabled=true;
    return;
  }

  currentRegistrations=data||[];
  renderRegistrations();
}

function renderRegistrations(){
  const valid=currentRegistrations.filter(r=>["confirmed","pending"].includes(r.status));
  const participantTotal=valid.reduce((sum,r)=>sum+Number(r.quantity||0),0);

  document.getElementById("registrationCount").textContent=currentRegistrations.length;
  document.getElementById("participantCount").textContent=participantTotal;
  document.getElementById("capacityCount").textContent=currentEvent?.capacity??0;
  summary.hidden=false;
  exportBtn.disabled=currentRegistrations.length===0;

  if(currentRegistrations.length===0){
    registrationList.innerHTML='<div class="empty">這個活動目前沒有報名資料。</div>';
    return;
  }

  registrationList.innerHTML=currentRegistrations.map(r=>{
    const participants=(r.participants||[]).slice().sort((a,b)=>a.id-b.id);
    const rows=participants.length
      ? participants.map((p,i)=>`
          <tr>
            <td>${i+1}</td>
            <td>${escapeHtml(p.name)}</td>
            <td>${escapeHtml(formatDate(p.birthday))}</td>
          </tr>`).join("")
      : `<tr><td colspan="3">沒有參加者資料</td></tr>`;

    return `
      <article class="registration-card">
        <div class="registration-head">
          <div>
            <h3>報名 #${r.id}｜${escapeHtml(r.name)}</h3>
            <div class="small">建立時間：${escapeHtml(formatDateTime(r.created_at))}</div>
          </div>
          <div>
            <span class="status">${escapeHtml(r.status)}</span>
            <span class="small">　${r.quantity} 人</span>
          </div>
        </div>

        <div class="registration-body">
          <div class="contact-grid">
            <div>
              <div class="meta-label">聯絡人</div>
              <div class="meta-value">${escapeHtml(r.name)}</div>
            </div>
            <div>
              <div class="meta-label">電話</div>
              <div class="meta-value">${escapeHtml(r.phone)}</div>
            </div>
            <div>
              <div class="meta-label">E-mail</div>
              <div class="meta-value">${escapeHtml(r.email)}</div>
            </div>
            <div>
              <div class="meta-label">LINE ID</div>
              <div class="meta-value">${escapeHtml(r.line_id||"—")}</div>
            </div>
          </div>

          <h3>參加者</h3>
          <table class="participants-table">
            <thead><tr><th>#</th><th>姓名</th><th>生日</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </article>`;
  }).join("");
}

exportBtn.addEventListener("click",()=>{
  if(!currentRegistrations.length)return;

  const rows=[["活動ID","活動名稱","報名編號","報名時間","狀態","聯絡人","電話","Email","LINE ID","報名人數","參加者姓名","生日"]];

  for(const r of currentRegistrations){
    const ps=(r.participants||[]).slice().sort((a,b)=>a.id-b.id);
    if(ps.length===0){
      rows.push([currentEvent.id,currentEvent.title,r.id,r.created_at,r.status,r.name,r.phone,r.email,r.line_id||"",r.quantity,"",""]);
    }else{
      for(const p of ps){
        rows.push([currentEvent.id,currentEvent.title,r.id,r.created_at,r.status,r.name,r.phone,r.email,r.line_id||"",r.quantity,p.name,p.birthday||""]);
      }
    }
  }

  const csv="\uFEFF"+rows.map(row=>row.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`event_${currentEvent.id}_registrations.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

(async()=>{
  const {data}=await client.auth.getSession();
  await applySession(data.session);
})();
</script>
</body>
</html>
